name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref so a fast-forward push doesn't
# spend minutes on stale CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap, single-version gate. Catches typing / lint / format violations
  # before spinning up the test matrix.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm qa:matrix
      - run: pnpm qa:matrix-calibration
      - run: pnpm --dir site exec svelte-kit sync
      - run: pnpm knip
      - run: pnpm build
      # Bundle-size gate: @office-kit/xlsx/streaming ≤80KB, full lib ≤120KB
      # (docs/plan/06-streaming.md §3.4 acceptance).
      - run: pnpm size

  # Multi-version, multi-OS test matrix. Active LTS lines + Current; Node 18 /
  # 20 are past EOL and intentionally dropped. macOS / Windows runs flush out
  # path-separator and TextDecoder / line-ending assumptions that ubuntu-only
  # CI would silently miss.
  test:
    needs: static
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # ECMA-376 conformance tests shell out to xmllint (libxml2-utils).
      # Install explicitly on each OS so the gate never silently degrades to
      # "no schema validation ran" — macOS / Windows runners don't ship it.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - if: runner.os == 'macOS'
        run: brew install libxml2
      - if: runner.os == 'Windows'
        run: choco install xsltproc --no-progress -y
        shell: pwsh
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Packaging gate. Everything above type-checks the repo against itself with
  # `moduleResolution: nodenext`, which is what keeps relative specifiers in
  # src/ extension-correct. This job checks the other half: that the artifact
  # npm would publish is consumable.
  #
  # The regression it exists to catch is silent. A shipped .d.ts whose relative
  # imports lack `.js` still resolves for bundlers, so `pnpm build` and `pnpm
  # size` stay green, but a consumer on `moduleResolution: node16` gets TS2834
  # inside node_modules, which `skipLibCheck: true` hides, leaving every
  # imported symbol typed as an error type. See tests/consumer/README.md.
  package:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Every published subpath resolves for node16 and for bundlers, and no
      # import inside a shipped .d.ts dangles.
      - run: pnpm check:attw
      # Install the tarball into tests/consumer and compile + run against it
      # under node16, nodenext and bundler resolution.
      - run: pnpm check:consumer
      - run: pnpm check:api-calibration
      - run: pnpm check:api
        env:
          QA_API_BASE_REF: ${{ github.event.pull_request.base.sha }}

  # Performance regression gate. Runs the dedicated perf-test config with
  # PERF_GATE=1 so the throughput thresholds in tests/perf/ fail the run on
  # regressions instead of skipping silently.
  perf:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # PERF_GATE=1 promotes the throughput / heap regressions in tests/perf/
      # from informational to fatal.
      #
      # Two attempts, because the fleet produces two shapes of noise. A runner
      # uniformly slower than the median is handled inside the read gate, which
      # divides its throughput by a machine probe. A stall confined to one
      # measurement window is not, and that is what the second attempt covers.
      # A real regression fails both.
      - name: Perf gate, retried once
        run: PERF_GATE=1 pnpm test:perf || PERF_GATE=1 pnpm test:perf

  browser-conformance:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: pnpm test:browser
      - run: dotnet restore tests/conformance/sdk --locked-mode
      - run: dotnet run --project tests/conformance/sdk --no-restore -- .qa/browser-packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-conformance
          path: |
            .qa/browser-results.json
            .qa/browser-packages/
            test-results/
          retention-days: 7

  independent-conformance:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils libreoffice-calc
      - run: pnpm install --frozen-lockfile
      - run: pnpm qa:corpus
      - run: dotnet restore tests/conformance/sdk --locked-mode
      - run: dotnet run --project tests/conformance/sdk --no-restore -- .qa/corpus
      - run: pnpm qa:office
      # Test manual evidence bookkeeping; this does not execute desktop Excel.
      - run: pnpm qa:excel-features
      - run: dotnet run --project tests/conformance/sdk --no-restore -- .qa/excel-feature-corpus
      - run: pnpm qa:native-excel
      - run: dotnet run --project tests/conformance/sdk --no-restore -- .qa/native-excel-corpus
      - run: pnpm qa:excel-calibration
      - run: pnpm qa:mutations
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: independent-conformance
          path: |
            .qa/corpus/
            .qa/excel-feature-corpus/
            .qa/native-excel-corpus/
            .qa/libreoffice/results.json
            .qa/mutations/
          retention-days: 7
